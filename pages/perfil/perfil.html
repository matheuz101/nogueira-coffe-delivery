<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FBF5EE">
    <title>Minha Conta - Nogueira Coffe</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <header class="cabecalho-conta">
        <h1>Minha Conta</h1>
    </header>

    <div class="pagina-conta">
        <aside class="lateral-conta">
            <nav class="menu-conta" aria-label="Navegação da conta">
                <a class="voltar" href="../principal/principal.html">Voltar</a>
                <a class="link-dados" href="#dados-pessoais">Dados pessoais</a>
                <a class="link-seguranca" href="#seguranca">Segurança</a>
            </nav>
        </aside>

        <main class="conteudo-conta">
            <section id="dados-pessoais" class="secao-conta" aria-labelledby="titulo-dados">
                <h2 id="titulo-dados">Informações pessoais</h2>

                <div class="foto-conta">
                    <span class="foto-vazia" role="img" aria-label="Foto de perfil não definida"></span>
                    <button class="editar-foto" type="button" aria-label="Alterar foto de perfil">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m15 5 4 4M4 20l4-1 12-12a2.8 2.8 0 0 0-4-4L4 15l-1 6Z"/>
                        </svg>
                    </button>
                </div>

                <div class="campos-conta">
                    <button class="campo-conta" type="button" aria-label="Editar nome">
                        <span class="nome-campo">Nome</span>
                        <span class="valor-campo">Username</span>
                    </button>
                    <button class="campo-conta" type="button" aria-label="Editar número de telefone">
                        <span class="nome-campo">Número de Telefone</span>
                        <span class="valor-campo">+55 (31) 99999-9999</span>
                    </button>
                    <button class="campo-conta" type="button" aria-label="Editar e-mail">
                        <span class="nome-campo">E-mail</span>
                        <span class="valor-campo">email1234@gmail.com</span>
                    </button>
                </div>
            </section>

            <section id="seguranca" class="secao-conta seguranca-conta" aria-labelledby="titulo-seguranca">
                <h2 id="titulo-seguranca">Segurança</h2>
                <div class="campos-conta">
                    <button class="campo-conta senha-conta" type="button" aria-label="Alterar senha">
                        <span class="nome-campo">Senha</span>
                        <span class="valor-campo" aria-hidden="true">••••••••</span>
                    </button>
                    <button class="campo-conta" type="button" aria-label="Configurar verificação em duas etapas">
                        <span class="nome-campo">Verificação em duas etapas</span>
                        <span class="valor-campo">Adicione mais segurança à sua conta com a verificação em duas etapas</span>
                    </button>
                    <button class="campo-conta" type="button" aria-label="Configurar telefone para recuperação">
                        <span class="nome-campo">Telefone para Recuperação</span>
                        <span class="valor-campo">Adicione um número de telefone alternativo para acessar sua conta</span>
                    </button>
                </div>
            </section>

            <button class="sair-conta" type="button">Terminar sessão</button>
        </main>
    </div>
</body>
</html>

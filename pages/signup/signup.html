<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FBF5EE">
    <title>Sign up - Nogueira Coffe</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js"></script>
</head>
<body>
    <main class="pagina-cadastro">
        <a class="marca-cadastro" href="../../index.html" aria-label="Nogueira Coffe — home">
            <img src="../../imgs/nogueira-logo.png" alt="Nogueira Café — desde 2026" width="152" height="152">
        </a>

        <h1 class="texto-escondido">Create your account</h1>
        <form id="formulario-cadastro" class="formulario-cadastro" action="/api/auth/signup" method="post">
            <div class="campo-cadastro">
                <label class="texto-escondido" for="primeiro-nome">First name</label>
                <input id="primeiro-nome" name="firstName" type="text" autocomplete="given-name" placeholder="Enter first name" required maxlength="100">
            </div>
            <div class="campo-cadastro">
                <label class="texto-escondido" for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter email" required maxlength="254" spellcheck="false" autocapitalize="none">
            </div>
            <div class="campo-cadastro">
                <label class="texto-escondido" for="telefone">Phone number</label>
                <input id="telefone" maxlength="19" oninput="mascara_tel()" name="phone" type="tel" placeholder="Enter phone number">
            </div>
            <div class="campo-cadastro">
                <label class="texto-escondido" for="senha">Password</label>
                <input id="senha" name="password" type="password" autocomplete="new-password" placeholder="Enter password" required minlength="8">
            </div>
            <div class="campo-cadastro">
                <label class="texto-escondido" for="confirmar-senha">Confirm password</label>
                <input id="confirmar-senha" name="passwordConfirmation" type="password" autocomplete="new-password" placeholder="Confirm password" required minlength="8">
            </div>
            <button class="botao-cadastro" type="button">Sign up</button>
        </form>
    </main>
</body>
</html>
